<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desafío de Sistemas de Ecuaciones – 4to C</title><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#f7f2ff,#eaf7ff);color:#202033;min-height:100vh}main{max-width:1000px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 35px #0001;margin:14px 0}h1{font-size:clamp(28px,6vw,52px);margin:5px 0 10px;line-height:1.05}.sub{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}button,input{font:inherit}button{border:0;border-radius:14px;padding:13px 18px;cursor:pointer;font-weight:700;background:#6d4aff;color:#fff;min-height:46px}button.secondary{background:#eee;color:#333}button:disabled{opacity:.5}input{width:100%;padding:13px;border:2px solid #ddd;border-radius:12px}label{font-weight:700;display:block;margin:10px 0 6px}.animals{display:flex;flex-wrap:wrap;gap:8px}.animal{font-size:30px;background:#f4f4f7;color:#222;padding:8px 12px}.animal.sel{outline:3px solid #6d4aff;background:#eee8ff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.room{font-size:38px;font-weight:900;letter-spacing:2px}.qr{min-height:190px;display:grid;place-items:center}.players,.scoreboard{display:grid;gap:8px}.player{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#f7f7fa;border-radius:12px}.pill{padding:4px 8px;border-radius:999px;background:#e9e7ff}.question{font-size:22px;font-weight:750;line-height:1.35}.answers{display:grid;gap:10px;margin-top:16px}.answers button{background:#f0eff6;color:#252331;text-align:left}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.timer{font-size:30px;font-weight:900}.winner{font-size:34px;font-weight:900;text-align:center;padding:25px}.confetti{font-size:34px;letter-spacing:8px}.msg{min-height:24px;color:#b00020;font-weight:700}@media(max-width:600px){main{padding:14px 10px}.card{padding:17px;border-radius:18px}.room{font-size:30px}.question{font-size:19px}}</style></head><body><main id="app"><section id="home" class="card"><h1>🧠 Desafío de Sistemas de Ecuaciones – 4to C</h1><p class="sub">Multijugador en tiempo real • 15 desafíos • 3 puntos por respuesta correcta • 5 minutos</p><div class="grid"><div><label>Tu nombre</label><input id="name" maxlength="20" placeholder="Escribe tu nombre"></div><div><label>Tu animal</label><div id="animals" class="animals"></div></div></div><div class="actions"><button id="create">Crear sala</button><button id="joinBtn" class="secondary">Unirse a una sala</button><button id="musicBtn" class="secondary">🎵 Música: apagada</button></div><div id="joinBox" class="hidden"><label>ID de la sala</label><input id="roomInput" placeholder="Ej. EC-45821" maxlength="8"><div class="actions"><button id="join">Entrar</button></div></div><div id="homeMsg" class="msg"></div></section><section id="lobby" class="card hidden"><div class="top"><div><div class="sub">Sala</div><div id="roomId" class="room"></div></div><div><div class="sub">Comparte este QR</div><div id="qr" class="qr"></div></div></div><p id="shareText"></p><h2>👥 Jugadores</h2><div id="players" class="players"></div><div class="actions"><button id="ready">Estoy listo</button><button id="start" class="hidden">🚀 Empezar partida</button><button id="leave" class="secondary">Salir</button></div><div id="lobbyMsg" class="msg"></div></section><section id="game" class="card hidden"><div class="top"><div><div class="sub">Pregunta <span id="qnum"></span> de 15</div><div class="pill" id="method"></div></div><div><div class="sub">Tiempo restante</div><div id="timer" class="timer">05:00</div></div></div><p id="question" class="question"></p><div id="answers" class="answers"></div><p id="feedback"></p><h2>🏆 Clasificación</h2><div id="scores" class="scoreboard"></div></section><section id="finish" class="card hidden"><div class="winner">🎉 <span id="winner"></span> 🎉<div class="confetti">✨ 🎊 🥳 🎊 ✨</div></div><div id="finalScores" class="scoreboard"></div><div class="actions"><button id="again">Jugar otra vez</button></div></section></main><audio id="music" loop preload="auto"><source src="/Married%20Life.mp3" type="audio/mpeg"></audio><script>const socket=io(),$=id=>document.getElementById(id);let selectedAnimal="🐹",roomId="",currentQ=0,questions=[],answered=false,timerInt=null;const animals=["🐹","🐰","🐱","🐶","🦊","🐼","🦁","🐯","🐻","🐸","🐵","🦄"];animals.forEach(a=>{const b=document.createElement("button");b.type="button";b.className="animal"+(a===selectedAnimal?" sel":"");b.textContent=a;b.onclick=()=>{selectedAnimal=a;document.querySelectorAll(".animal").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")};$("animals").appendChild(b)});function show(id){["home","lobby","game","finish"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function msg(id,t){$(id).textContent=t||""}function identity(){const name=$("name").value.trim();if(!name){msg("homeMsg","Escribe tu nombre.");return null}return{name,animal:selectedAnimal}}function makeQR(){$("qr").innerHTML="";const url=location.origin+location.pathname+"?sala="+encodeURIComponent(roomId);if(window.QRCode)new QRCode($("qr"),{text:url,width:180,height:180})$("shareText").textContent="Escanea el QR o escribe este código: "+roomId}$("create").onclick=()=>{const x=identity();if(x)socket.emit("room:create",x)};$("joinBtn").onclick=()=>{$("joinBox").classList.toggle("hidden");$("roomInput").focus()};$("join").onclick=()=>{const x=identity(),id=$("roomInput").value.trim().toUpperCase();if(!x)return;if(!/^EC-\d{5}$/.test(id)){msg("homeMsg","El ID debe tener formato EC-12345.");return}socket.emit("room:join",{...x,id})};$("ready").onclick=()=>socket.emit("player:ready",{id:roomId,ready:true});$("start").onclick=()=>socket.emit("game:start",{id:roomId});$("leave").onclick=()=>location.reload();$("again").onclick=()=>location.reload();socket.on("room:created",d=>{roomId=d.id;history.replaceState(null,"","?sala="+roomId)});socket.on("room:joined",d=>{roomId=d.id;history.replaceState(null,"","?sala="+roomId)});socket.on("room:update",r=>{roomId=r.id;$("roomId").textContent=r.id;makeQR();show("lobby");$("players").innerHTML=r.players.map(p=>`<div class="player"><span>${p.animal} ${escapeHtml(p.name)}</span><span class="pill">${p.ready?"✅ listo":"⏳ esperando"} · ${p.score} pts</span></div>`).join("");const host=r.hostId===socket.id;$("start").classList.toggle("hidden",!host);$("start").disabled=!r.players.every(p=>p.ready)});socket.on("game:start",d=>{questions=d.questions;currentQ=d.questionIndex;show("game");renderQuestion();startTimer(d.endsAt)});socket.on("game:question",d=>{currentQ=d.questionIndex;renderQuestion()});socket.on("answer:result",d=>{$("feedback").textContent=d.correct?"✅ ¡Correcto! +3 puntos":"❌ Incorrecto. No sumas puntos."});socket.on("game:finished",r=>{clearInterval(timerInt);show("finish");const ps=[...r.players].sort((a,b)=>b.score-a.score);$("winner").textContent=ps[0]?`${ps[0].animal} ${ps[0].name} — ${ps[0].score} puntos`:"Partida terminada";$("finalScores").innerHTML=ps.map((p,i)=>`<div class="player"><span>${i+1}. ${p.animal} ${escapeHtml(p.name)}</span><b>${p.score} pts</b></div>`).join("")});socket.on("error:msg",t=>{msg("homeMsg",t);msg("lobbyMsg",t)});function renderQuestion(){const q=questions[currentQ];if(!q)return;$("qnum").textContent=currentQ+1;$("method").textContent=q.method;$("question").textContent=q.text;$("feedback").textContent="";const w=$("answers");w.innerHTML="";answered=false;q.answers.forEach((a,i)=>{const b=document.createElement("button");b.textContent=a;b.onclick=()=>{if(answered)return;answered=true;w.querySelectorAll("button").forEach(x=>x.disabled=true);socket.emit("answer",{id:roomId,questionIndex:currentQ,answerIndex:i})};w.appendChild(b)})}function startTimer(end){clearInterval(timerInt);function tick(){const s=Math.max(0,Math.ceil((end-Date.now())/1000));$("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(s<=0)clearInterval(timerInt)}tick();timerInt=setInterval(tick,250)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}$("musicBtn").onclick=async()=>{const m=$("music");if(m.paused){try{await m.play();$("musicBtn").textContent="🎵 Música: encendida"}catch{msg("homeMsg","Pulsa otra vez para activar la música.")}}else{m.pause();$("musicBtn").textContent="🎵 Música: apagada"}};const sala=new URLSearchParams(location.search).get("sala");if(sala){$("joinBox").classList.remove("hidden");$("roomInput").value=sala.toUpperCase()}</script></body></html>
